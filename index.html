<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Échos de l'Espace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #02040a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .echo-bubble {
            max-width: 85%;
            padding: 10px 15px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            font-size: 14px;
            line-height: 1.45;
            word-wrap: break-word;
            background-color: rgba(255, 255, 255, 0.14);
            color: #fff;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            animation: fadeIn 0.25s ease-out;
        }

        .sent-flash {
            font-size: 12px;
            color: rgba(180, 210, 255, 0.65);
            text-align: center;
            padding: 4px 0;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-black text-white overflow-hidden select-none touch-none">

    <!-- Canvas 3D -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- Interface Superposée -->
    <div class="relative z-10 flex flex-col h-[100dvh] justify-between p-4 pointer-events-none">

        <!-- Barre supérieure -->
        <div class="flex justify-end items-center w-full max-w-md mx-auto pt-2">
            <button id="receive-btn" class="pointer-events-auto px-4 py-2 rounded-full text-xs font-semibold bg-white/15 hover:bg-white/25 backdrop-blur-md border border-white/15 text-white active:scale-95 transition-all">
                Recevoir un message
            </button>
        </div>

        <!-- Zone centrale / Messages reçus -->
        <div class="w-full max-w-md mx-auto flex flex-col gap-3 pb-2">

            <div id="feed-container" class="h-60 overflow-y-auto flex flex-col gap-2.5 p-3 rounded-2xl bg-black/40 backdrop-blur-md border border-white/10 pointer-events-auto scrollbar-none">
            </div>

            <!-- Envoi à sens unique -->
            <form id="send-form" class="flex gap-2 pointer-events-auto">
                <input
                    type="text"
                    id="message-input"
                    placeholder="Laisser une phrase..."
                    autocomplete="off"
                    class="flex-1 bg-white/10 border border-white/15 rounded-full px-4 py-3 text-sm text-white placeholder-white/40 focus:outline-none focus:border-white/40 transition-all"
                >
                <button
                    type="submit"
                    class="bg-white text-black px-5 py-3 rounded-full text-sm font-semibold active:scale-95 transition-transform"
                >
                    Envoyer
                </button>
            </form>

        </div>
    </div>

    <script>
        // --- ESPACE 3D & ÉTOILES RONDES ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x02040a, 0.0015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x02040a, 1);
        container.appendChild(renderer.domElement);

        function createCircleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(200, 220, 255, 0.85)');
            gradient.addColorStop(0.65, 'rgba(100, 150, 255, 0.25)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(32, 32, 32, 0, Math.PI * 2);
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        const starsCount = 1500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(starsCount * 3);
        const colors = new Float32Array(starsCount * 3);

        for (let i = 0; i < starsCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 120;
            positions[i + 1] = (Math.random() - 0.5) * 120;
            positions[i + 2] = (Math.random() - 0.5) * 120;

            colors[i] = 0.8 + Math.random() * 0.2;
            colors[i + 1] = 0.85 + Math.random() * 0.15;
            colors[i + 2] = 1.0;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.6,
            map: createCircleTexture(),
            transparent: true,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const starField = new THREE.Points(geometry, material);
        scene.add(starField);

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotationX = 0;
        let targetRotationY = 0;

        function onPointerDown(e) {
            isDragging = true;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            previousMousePosition = { x, y };
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;

            const deltaX = x - previousMousePosition.x;
            const deltaY = y - previousMousePosition.y;

            targetRotationY += deltaX * 0.003;
            targetRotationX += deltaY * 0.003;

            previousMousePosition = { x, y };
        }

        function onPointerUp() {
            isDragging = false;
        }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            starField.rotation.y += (targetRotationY - starField.rotation.y) * 0.05;
            starField.rotation.x += (targetRotationX - starField.rotation.x) * 0.05;
            starField.rotation.z += 0.0003;
            renderer.render(scene, camera);
        }
        animate();

        // --- LOGIQUE À SENS UNIQUE (ENVOI DANS LE VIDE / RÉCEPTION ALÉATOIRE) ---
        const STORAGE_KEY = "space_oneway_messages_v1";
        const feedContainer = document.getElementById('feed-container');
        const sendForm = document.getElementById('send-form');
        const messageInput = document.getElementById('message-input');
        const receiveBtn = document.getElementById('receive-btn');

        const INITIAL_MESSAGES = [
            "Quelqu'un regarde les mêmes étoiles ce soir.",
            "Si tu lis ça, il est peut-être tard quelque part.",
            "Une phrase lancée au hasard dans le noir."
        ];

        function getStoredMessages() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) && parsed.length > 0 ? parsed : INITIAL_MESSAGES;
            } catch (_) {
                return INITIAL_MESSAGES;
            }
        }

        function saveMessage(text) {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                const list = raw ? JSON.parse(raw) : [];
                const updated = Array.isArray(list) ? list : [];
                updated.push(text);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
            } catch (_) {}
        }

        function addReceivedBubble(text) {
            const bubble = document.createElement('div');
            bubble.className = 'echo-bubble';
            bubble.textContent = text;
            feedContainer.appendChild(bubble);
            feedContainer.scrollTop = feedContainer.scrollHeight;
        }

        function addSentNotice() {
            const note = document.createElement('div');
            note.className = 'sent-flash';
            note.textContent = "Envoyé";
            feedContainer.appendChild(note);
            feedContainer.scrollTop = feedContainer.scrollHeight;
        }

        function receiveRandomMessage() {
            const pool = getStoredMessages();
            const randomIndex = Math.floor(Math.random() * pool.length);
            addReceivedBubble(pool[randomIndex]);
        }

        sendForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            saveMessage(text);
            messageInput.value = '';
            addSentNotice();
        });

        receiveBtn.addEventListener('click', receiveRandomMessage);

        // Affiche un premier message aléatoire à l'ouverture
        receiveRandomMessage();
    </script>
</body>
</html>
